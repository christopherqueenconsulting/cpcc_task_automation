# An action for setting up poetry install with caching.
# Using a custom action since the default action does not
# take poetry install groups into account.
# Action code from:
# https://github.com/actions/setup-python/issues/505#issuecomment-1273013236
#
# ---------------------------------------------------------------------------
# CACHING RULES (please read before editing any `key:` below)
# ---------------------------------------------------------------------------
# A GitHub Actions cache entry is readable ONLY from the ref that wrote it,
# plus the repository default branch. Three consequences drive this file:
#
#   1. Saving a cache from a PR ref (`refs/pull/<n>/merge`) writes an entry
#      that nothing else can ever restore. It is write-only garbage, and it
#      counts against the repo's 10 GB budget. When the budget is hit GitHub
#      evicts least-recently-used, and what it evicts is master's entry --
#      the one entry every branch CAN read. That turns into a ~100% miss rate.
#      So: every `cache/save` step below is gated on `github.ref` == master.
#
#   2. The cache scope must be a deterministic function of the DEPENDENCY
#      INPUTS only (OS, arch, python version, poetry version, dependency
#      groups, poetry.lock hash). Never a run id, run number, github.sha, a
#      timestamp, or a job name. A job name is the subtle one: two jobs that
#      install identical dependency groups would each write their own ~900 MB
#      copy of the same virtualenv. The scope slug is therefore DERIVED from
#      `install-args` rather than accepted as a free-text input.
#
#   3. Cache only `${WORKDIR}/.venv`. poetry.toml sets `in-project = true`, so
#      `.venv` IS the environment; `~/.cache/pypoetry/virtualenvs` is empty and
#      `~/.cache/pip` + `~/.cache/pypoetry/{cache,artifacts}` are just the same
#      packages a second time as downloaded wheels. Caching all of them stored
#      every dependency roughly three times over.
#
# `poetry install` always runs, even on an exact cache hit. That is deliberate:
# it makes the restore-keys ladder below completely safe (a near-miss venv is
# reconciled against poetry.lock rather than trusted), and it keeps this action
# a pure speed-up that can never change what actually gets installed.
name: poetry-install-with-caching
description: Poetry install with support for caching of dependency groups.

inputs:
  python-version:
    description: Python version, supporting MAJOR.MINOR only
    required: true

  poetry-version:
    description: Poetry version
    required: true

  install-args:
    description: >-
      Arguments passed to `poetry install` (e.g. "--with test").
      Also determines the dependency-group cache scope, so jobs installing
      identical groups share a single cache entry.
    required: true

  working-directory:
    description: Directory whose poetry.lock file should be cached
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      name: Setup python ${{ inputs.python-version }}
      id: setup-python
      with:
        python-version: ${{ inputs.python-version }}

    # Exact-match only, no restore-keys: a poetry binary built for a different
    # poetry/python version must never be restored in place of the pinned one.
    - uses: actions/cache/restore@v4
      id: cache-bin-poetry
      name: Restore Poetry binary - Python ${{ inputs.python-version }}
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MIN: "1"
      with:
        path: |
          /opt/pipx/venvs/poetry
        # This step caches the poetry installation, so make sure it's keyed on the poetry version as well.
        key: bin-poetry-${{ runner.os }}-${{ runner.arch }}-py-${{ inputs.python-version }}-${{ inputs.poetry-version }}

    - name: Refresh shell hashtable and fixup softlinks
      if: steps.cache-bin-poetry.outputs.cache-hit == 'true'
      shell: bash
      env:
        POETRY_VERSION: ${{ inputs.poetry-version }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -eux

        # Refresh the shell hashtable, to ensure correct `which` output.
        hash -r

        # `actions/cache@v3` doesn't always seem able to correctly unpack softlinks.
        # Delete and recreate the softlinks pipx expects to have.
        rm /opt/pipx/venvs/poetry/bin/python
        cd /opt/pipx/venvs/poetry/bin
        ln -s "$(which "python$PYTHON_VERSION")" python
        chmod +x python
        cd /opt/pipx_bin/
        ln -s /opt/pipx/venvs/poetry/bin/poetry poetry
        chmod +x poetry

        # Ensure everything got set up correctly.
        /opt/pipx/venvs/poetry/bin/python --version
        /opt/pipx_bin/poetry --version

    - name: Install poetry
      if: steps.cache-bin-poetry.outputs.cache-hit != 'true'
      shell: bash
      env:
        POETRY_VERSION: ${{ inputs.poetry-version }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      # Install poetry using the python version installed by setup-python step.
      run: pipx install "poetry==$POETRY_VERSION" --python '${{ steps.setup-python.outputs.python-path }}' --verbose

    # See rule 1 in the header comment: save from master only.
    - name: Save Poetry binary
      if: >-
        steps.cache-bin-poetry.outputs.cache-hit != 'true' &&
        github.ref == 'refs/heads/master'
      uses: actions/cache/save@v4
      with:
        path: |
          /opt/pipx/venvs/poetry
        key: bin-poetry-${{ runner.os }}-${{ runner.arch }}-py-${{ inputs.python-version }}-${{ inputs.poetry-version }}

    # See rule 2 in the header comment. Deriving the scope from install-args
    # means the cache key cannot drift away from what is actually installed,
    # and jobs installing the same groups converge on one entry:
    #   "--with test"                    -> with-test
    #   "--with test,e2e"                -> with-test-e2e
    #   "--with=test_integration,test"   -> with-test-integration-test
    - name: Derive dependency-group cache scope
      id: scope
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: |
        set -eu
        slug="$(printf '%s' "$INSTALL_ARGS" \
          | tr -c '[:alnum:]' '-' \
          | tr -s '-' \
          | sed 's/^-//; s/-$//')"
        echo "slug=${slug:-default}" >> "$GITHUB_OUTPUT"

    - name: Restore Poetry virtualenv
      id: cache-venv
      uses: actions/cache/restore@v4
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MIN: "4"
        WORKDIR: ${{ inputs.working-directory == '' && '.' || inputs.working-directory }}
      with:
        path: ${{ env.WORKDIR }}/.venv
        key: venv-${{ runner.os }}-${{ runner.arch }}-py-${{ inputs.python-version }}-poetry-${{ inputs.poetry-version }}-${{ steps.scope.outputs.slug }}-${{ hashFiles(format('{0}/**/poetry.lock', env.WORKDIR)) }}
        # One rung, dropping only the lockfile hash. Dependabot changes
        # poetry.lock constantly; without this ladder every such PR is a total
        # miss and reinstalls from scratch. With it, the previous venv for the
        # same dependency groups is restored and `poetry install` only has to
        # reconcile the packages that actually changed.
        restore-keys: |
          venv-${{ runner.os }}-${{ runner.arch }}-py-${{ inputs.python-version }}-poetry-${{ inputs.poetry-version }}-${{ steps.scope.outputs.slug }}-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory == '' && '.' || inputs.working-directory }}
      run: poetry install ${{ inputs.install-args }} --no-interaction --no-ansi

    # See rule 1 in the header comment: save from master only. This runs after
    # `poetry install` so the saved `.venv` is complete.
    - name: Save Poetry virtualenv
      if: >-
        steps.cache-venv.outputs.cache-hit != 'true' &&
        github.ref == 'refs/heads/master'
      uses: actions/cache/save@v4
      env:
        WORKDIR: ${{ inputs.working-directory == '' && '.' || inputs.working-directory }}
      with:
        path: ${{ env.WORKDIR }}/.venv
        key: venv-${{ runner.os }}-${{ runner.arch }}-py-${{ inputs.python-version }}-poetry-${{ inputs.poetry-version }}-${{ steps.scope.outputs.slug }}-${{ hashFiles(format('{0}/**/poetry.lock', env.WORKDIR)) }}
