# Dependabot configuration for CPCC Task Automation
# Monitors Python dependencies, GitHub Actions, and Docker images
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (Poetry)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    # One weekly PR for all minor/patch bumps. Separate PRs all rewrite
    # poetry.lock, so each merge used to put the rest into conflict.
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
      # Security updates also bump transitive packages (urllib3, anyio, ...),
      # one PR each by default, all rewriting poetry.lock. Group them too.
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Parked major bump: pymupdf 2.0 has no macOS x86_64 wheel and its sdist build
    # fails, so `poetry install` fails on an Intel Mac (Linux CI is fine; 43 PDF tests
    # pass on Linux). See PR #441. Remove this rule once pymupdf ships a macOS x86_64
    # wheel or the maintainer decides to drop Intel Mac support, then bump by hand.
    ignore:
      - dependency-name: "pymupdf"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Sandbox image for student programs (docker/exec-runner). The base is pinned by digest.
  # A change here edits the Dockerfile, so the hash test in tests/unit/test_program_runner.py
  # fails until the version is bumped by hand; dependabot-auto-merge.yml also skips it.
  - package-ecosystem: "docker"
    directory: "/docker/exec-runner"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "exec-runner"
    # The sandbox moved to eclipse-temurin 25 (PR supersedes #438). Later semver-major bumps
    # still need a human PR (RUNNER_VERSION, RUNNER_SOURCE_SHA256, compose tag, test regex,
    # docs, CI host Java).
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
