name: CI / Test Suite

on:
  # Required checks must also run on merge-queue groups, or the queue waits
  # for them until it times out.
  merge_group:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Explicit permissions to allow workflow to run automatically on PRs
# without requiring manual approval
permissions:
  contents: read
  pull-requests: read

# One run per PR head: a new push cancels the superseded run. merge_group and push runs are
# never cancelled (the queue and master history need every verdict).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.7.1"

jobs:
  # Two shards, each running pytest-xdist inside. tests/unit/conftest.py keeps a whole FILE in
  # one shard (UNIT_SHARDS / UNIT_SHARD), so module fixtures never run twice. Design and local
  # use: docs/CI_SHARDING.md. The job name carries the matrix value; the REQUIRED check is the
  # `unit-tests` gate job below, not these. Exhaustive real-compiler checks run in
  # `compiler-tests` alongside the shards and are included in that required gate.
  shard:
    name: Unit shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      UNIT_SHARDS: "2"
      UNIT_SHARD: ${{ matrix.shard }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python + Poetry ${{ env.POETRY_VERSION }}
        uses: "./.github/actions/poetry_setup"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          working-directory: "."
          # Determines both the install and the cache scope. Identical to the
          # integration job's groups, so the two share one cache entry.
          install-args: "--with test"
          # An exact venv-cache hit is already the finished environment.
          skip-install-on-exact-hit: "true"

      # What the runner gives xdist. `-n auto` uses psutil physical cores (2 of 4 vCPUs) when psutil imports.
      - name: CPU diagnostic
        shell: bash
        run: |
          echo "nproc: $(nproc)"
          poetry run python -c "import os; print('cpu_count, affinity:', os.cpu_count(), len(os.sched_getaffinity(0)))"
          poetry run python -c "import psutil; print('psutil', psutil.__version__, 'physical:', psutil.cpu_count(logical=False), 'logical:', psutil.cpu_count())" || echo "psutil: not installed"

      - name: Run unit tests (shard ${{ matrix.shard }} of 2)
        shell: bash
        run: |
          echo "Running unit tests shard ${UNIT_SHARD}/${UNIT_SHARDS} with pytest..."
          poetry run pytest -m "unit and not compiler" --ignore=tests/e2e -n logical --dist loadfile --cov=src --cov-branch --cov-report=xml --junitxml=junit-unit.xml -o junit_family=legacy --durations=25

      # Collected-count guard (read by the gate): this shard's test count from its own junit
      # file, and, from shard 2 only, the UNSHARDED collection count. The gate fails if the
      # shard counts do not add up to the full count, so a conftest bug that drops a file from
      # both shards cannot pass.
      - name: Record collected counts
        shell: bash
        run: |
          python3 - <<'PY' > "count-${UNIT_SHARD}.txt"
          import xml.etree.ElementTree as ET
          root = ET.parse("junit-unit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          print(sum(int(s.get("tests", 0)) for s in suites))
          PY
          if [ "${UNIT_SHARD}" = "2" ]; then
            env -u UNIT_SHARDS -u UNIT_SHARD poetry run pytest -m "unit and not compiler" --ignore=tests/e2e --collect-only -q -p no:cacheprovider \
              | sed -nE 's#^([0-9]+)(/[0-9]+)? tests? collected.*#\1#p' > count-full.txt
          fi
          echo "shard ${UNIT_SHARD} count: $(cat count-${UNIT_SHARD}.txt)"
          [ "${UNIT_SHARD}" != "2" ] || echo "unsharded count: $(cat count-full.txt)"

      - name: Upload collected counts
        uses: actions/upload-artifact@v7
        with:
          name: unit-count-${{ matrix.shard }}
          path: count-*.txt
          retention-days: 1

      # Once per run, in shard 1 only; a failure here fails shard 1 and so the gate.
      - name: Prompt registry (changed prompts bumped their version)
        if: github.event_name == 'pull_request' && matrix.shard == 1
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${BASE_REF}"
          poetry run python -m cqc_cpcc.model_eval prompts check --base-ref FETCH_HEAD

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        # Skip Codecov upload for Dependabot PRs to reduce unnecessary uploads.
        # Runs whether tests pass or fail, but not when the run was cancelled.
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          # Distinct name per shard. Both use flag `unit`; Codecov merges them.
          name: unit-coverage-${{ matrix.shard }}

          # Codecov token for authentication
          token: ${{ secrets.CODECOV_TOKEN }}

          # Coverage file(s) to upload
          files: ./coverage.xml
          # Upload only this job's report. Without this the uploader also picks up
          # any other coverage*.xml in the checkout (stale ones were once committed)
          # and Codecov merges their old line numbers into the new report.
          disable_search: true

          # Flags to categorize this upload
          flags: unit

          # Fail CI if upload fails (ensures patch gate is meaningful)
          fail_ci_if_error: true

          # Verbose output for debugging
          verbose: true

      - name: Upload test results to Codecov
        # Upload test results even if tests fail (using !cancelled())
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          # codecov/test-results-action is deprecated; codecov-action uploads test results with report_type
          report_type: test_results
          files: ./junit-unit.xml
          disable_search: true

  # `unit-tests` is the REQUIRED check name in branch protection and the merge queue. A matrix
  # job's name carries its matrix value, so this aggregate keeps the exact name reporting.
  # Renaming or dropping it silently un-gates the unit lane.
  #
  # `if: always()` so a failed or cancelled shard still produces a verdict rather than leaving
  # the required check pending; only `success` passes.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [shard, compiler-tests]
    if: always()
    steps:
      - name: Every shard passed
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
          COMPILER_RESULT: ${{ needs.compiler-tests.result }}
        run: |
          echo "shard matrix result: ${SHARD_RESULT}"
          echo "compiler test result: ${COMPILER_RESULT}"
          [ "${SHARD_RESULT}" = "success" ] && [ "${COMPILER_RESULT}" = "success" ] || {
            echo "::error::Unit shards or exhaustive compiler tests failed (shards: ${SHARD_RESULT}; compiler: ${COMPILER_RESULT})."
            exit 1
          }

      - name: Download collected counts
        uses: actions/download-artifact@v8
        with:
          pattern: unit-count-*
          merge-multiple: true

      # shard 1 + shard 2 must equal the unsharded collection (every test in exactly one shard).
      - name: Shard counts add up to the full collection
        run: |
          a=$(cat count-1.txt); b=$(cat count-2.txt); full=$(cat count-full.txt)
          echo "shard 1: ${a}, shard 2: ${b}, unsharded: ${full}"
          [ -n "${full}" ] && [ "$((a + b))" -eq "${full}" ] || {
            echo "::error::Shard counts (${a} + ${b}) differ from the unsharded count (${full}): tests were dropped or duplicated."
            exit 1
          }

  # Dataset-wide javac/g++ checks remain required through the unit-tests gate,
  # but run separately so their compiler subprocesses do not lengthen a unit shard.
  compiler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python + Poetry ${{ env.POETRY_VERSION }}
        uses: "./.github/actions/poetry_setup"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          working-directory: "."
          install-args: "--with test"
          skip-install-on-exact-hit: "true"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Run exhaustive real-compiler checks
        shell: bash
        env:
          CQC_REQUIRE_REAL_COMPILERS: "true"
        run: |
          poetry run pytest -m "unit and compiler" tests/unit/test_model_eval.py tests/unit/test_grading_solution_suite.py \
            --cov=src --cov-branch --cov-report=xml:coverage-compiler.xml \
            --junitxml=junit-compiler.xml -o junit_family=legacy --durations=25

      - name: Upload compiler coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          name: compiler-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-compiler.xml
          disable_search: true
          flags: unit
          fail_ci_if_error: true
          verbose: true

      - name: Upload compiler test results to Codecov
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          report_type: test_results
          files: ./junit-compiler.xml
          disable_search: true

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python + Poetry ${{ env.POETRY_VERSION }}
        uses: "./.github/actions/poetry_setup"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          working-directory: "."
          # Shared with unit tests so both jobs can reuse the same exact environment cache.
          install-args: "--with test"
          skip-install-on-exact-hit: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the exec-runner sandbox image
        uses: docker/build-push-action@v6
        with:
          context: docker/exec-runner
          tags: cpcc_task_automation/exec-runner:2
          load: true
          cache-from: type=gha,scope=exec-runner-v2
          cache-to: type=gha,mode=min,scope=exec-runner-v2

      - name: Run integration tests with coverage
        shell: bash
        env:
          OPENAI_API_KEY: "test-key-not-used"
        run: |
          echo "Running integration tests with coverage..."
          poetry run pytest -m integration --ignore=tests/e2e --cov=src --cov-branch --cov-report=xml:coverage-integration.xml --cov-report=term-missing --junitxml=junit-integration.xml -o junit_family=legacy

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          name: integration-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.xml
          disable_search: true
          flags: integration
          fail_ci_if_error: true
          verbose: true

      - name: Upload integration test results to Codecov
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          report_type: test_results
          files: ./junit-integration.xml
          disable_search: true

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python + Poetry ${{ env.POETRY_VERSION }}
        uses: "./.github/actions/poetry_setup"
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}
          working-directory: "."
          install-args: "--with test,e2e"
          skip-install-on-exact-hit: "true"

      - name: Install Playwright headless browser
        shell: bash
        run: poetry run playwright install chromium --only-shell

      - name: Run E2E tests with coverage
        shell: bash
        env:
          CQC_TEST_MODE: "true"
          OPENAI_API_KEY: "test-key-not-used-in-test-mode"
        run: |
          echo "Running E2E tests with coverage..."
          poetry run pytest -m e2e --cov=src --cov-branch --cov-report=xml:coverage-e2e.xml --cov-report=term-missing --junitxml=junit-e2e.xml -o junit_family=legacy

      - name: Upload E2E coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          name: e2e-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-e2e.xml
          disable_search: true
          flags: e2e
          fail_ci_if_error: true
          verbose: true

      - name: Upload E2E test results to Codecov
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: e2e
          report_type: test_results
          files: ./junit-e2e.xml
          disable_search: true

  codecov-finalize:
    name: Finalize Codecov reports
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, compiler-tests, integration-tests, e2e-tests]
    # The coverage upload jobs are skipped for Dependabot PRs; don't send a
    # completion signal for uploads that were intentionally not made.
    if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Send Codecov notifications after all coverage uploads
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: true
