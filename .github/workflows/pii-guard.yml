name: PII Guard

permissions:
  contents: read

on:
  pull_request:
  # Required check, so it must also report on merge-queue groups.
  merge_group:
  push:
    branches:
      - master

concurrency:
  # Cancel a superseded PR run. Never cancel merge_group or push runs:
  # cancelling a merge-queue run evicts the PR from the queue.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pii-guard:
    name: Student PII guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scan tracked files for student PII and BrightSpace ids
        run: python scripts/pii_guard.py
