# Codecov Configuration for CPCC Task Automation
# Documentation: https://docs.codecov.com/docs/codecov-yaml

# Global settings
codecov:
  # Require CI to pass before processing coverage
  require_ci_to_pass: yes
  
  # Use master branch as the source of truth for YAML config
  # This prevents rogue branches from changing coverage rules
  strict_yaml_branch: master

  # Codecov will reject reports that are over 12 hours old according to the timestamp in the report. 
  # This is to prevent reports that may have been accidentally checked into
  # To disable this functionality please add the following
  max_report_age: off
  #max_report_age can be listed in hours '#h' (hours) or '#d' (days)

  # Wait for all four COVERAGE uploads on a commit before posting any status: unit shard 1,
  # unit shard 2, integration, e2e (none path-filtered). Codecov counts coverage uploads
  # (codecov-action, one "session" each); test-results uploads do NOT count, whether made by the
  # old codecov/test-results-action or by codecov-action with report_type: test_results.
  # Evidence, PR #511 head a2805d4 with after_n_builds: 8 (4 coverage + 4 test-results uploads
  # all received, Codecov API reported sessions: 4): no codecov status or coverage comment was
  # posted in the 25+ minutes after the last upload, so 8 is never reached. Do not add the
  # test-results uploads to this number. (PR #510's early comment is explained by Codecov
  # computing it before the third coverage upload had finished processing, not by
  # test-results uploads.) Re-running one workflow uploads again for the same commit and can
  # reach the count early, so re-run all three coverage workflows together. merge_group and
  # push-to-master commits also get the 4 uploads (patch is only_pulls, so no patch status
  # is expected there).
  # tests/unit/test_codecov_upload_contract.py fails if this number and the workflows disagree;
  # change the shard count and this number together.
  notify:
    after_n_builds: 4

# Coverage analysis configuration
coverage:
  # Precision for coverage percentages (2 decimal places)
  precision: 2
  
  # Round coverage to nearest decimal
  round: down
  
  # Coverage range for color coding in UI
  range: "70...100"
  
  # Status checks configuration
  status:
    # PROJECT status: Track overall repository coverage
    # Set to INFORMATIONAL - won't block PRs but shows trend
    project:
      default:
        # Target: 80% overall project coverage
        target: 80%
        
        # Threshold: Allow up to 1% drop without failing
        # (Even though informational, this sets expectations)
        threshold: 1%
        
        # INFORMATIONAL MODE: This status will always pass
        # We want to see project coverage and drive it upward,
        # but not block PRs while repo is climbing from 49% → 80%
        informational: true
        
        # Only evaluate on pull requests
        only_pulls: true
        
        # Paths to include in project coverage calculation
        paths:
          - "src/cqc_cpcc/"
    
    # PATCH status: Enforce coverage on NEW code in PRs
    # This is our PRIMARY enforcement gate
    patch:
      default:
        # Target: 80% coverage on all new/modified code
        target: 80%

        # Threshold: 0% - no drops allowed for new code
        # New code must meet the 80% bar
        threshold: 0%

        # Only evaluate on pull requests
        only_pulls: true

        # Fail if the commit has no coverage at all. Note: with notify.after_n_builds: 4, a commit
        # that gets fewer than 4 uploads (a job failed before its upload step, a fork PR without
        # the token) gets NO codecov/patch status, not a failure. Re-run the coverage workflows
        # for that commit, or check its upload count on the Codecov commit page.
        if_not_found: failure

        # Paths included in the ENFORCING patch gate: all backend logic EXCEPT the
        # browser-automation surface. Selenium/WebDriver + MFA/login + BrightSpace
        # fetch/write-back code is driven through a live browser and is exercised by
        # the integration/e2e suites, not unit tests — gating it at 80% would only
        # reward low-value mock churn. Those modules are still REPORTED (see the
        # informational "Browser Automation & MFA" component below); they just don't
        # block PRs. This mirrors how "Core Automation" (brightspace.py et al.) is
        # already treated. New PURE logic (grading, rubric, parsing, zip, dates) stays
        # gated at 80%.
        paths:
          - "src/cqc_cpcc/"
          - "!src/cqc_cpcc/utilities/selenium_util.py"
          - "!src/cqc_cpcc/utilities/brightspace_fetch.py"
          - "!src/cqc_cpcc/utilities/brightspace_writeback.py"
          - "!src/cqc_cpcc/utilities/brightspace_submissions.py"
          - "!src/cqc_cpcc/utilities/utils.py"

# Comment configuration for PR feedback
comment:
  # Post coverage summary as PR comment
  # Include component information in PR comments
  layout: "condensed_header, condensed_files, condensed_footer, components"
  
  # Show both patch and project status in comment
  behavior: default
  
  # Require changes to post new comment
  require_changes: false

  # Same as codecov.notify.after_n_builds: no PR comment until all four coverage uploads are in.
  after_n_builds: 4

# Ignore patterns - exclude files from coverage analysis
# These match the patterns in pyproject.toml [tool.coverage.run] omit
ignore:
  - "tests/**/*"
  - "src/cqc_cpcc/utilities/AI/llm_deprecated/**/*"
  - "src/cqc_streamlit_app/app_pages/**/*"
  - "src/cqc_streamlit_app/grade_assignment.py"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/conftest.py"

# Flag configuration for different test types
# We upload coverage separately for unit (two shards, same flag), integration, and e2e tests
flags:
  unit:
    # Coverage from unit tests. Streamlit UI modules are unit-tested in-process
    # with st.testing.v1.AppTest, and the unit job already measures them
    # (--cov=src), so their coverage counts here too.
    paths:
      - "src/cqc_cpcc/"
      - "src/cqc_streamlit_app/"
    # Join with other flags if they exist
    carryforward: true
  
  integration:
    # Coverage from integration tests (backend only, no UI)
    paths:
      - "src/cqc_cpcc/"
    # Join with other flags
    carryforward: true
  
  e2e:
    # Coverage from end-to-end tests (includes Streamlit UI)
    # E2E tests exercise both backend and frontend code
    paths:
      - "src/cqc_cpcc/"
      - "src/cqc_streamlit_app/"
    # Join with other flags
    carryforward: true

# Component configuration for categorizing coverage by logical areas
# Components provide virtual filters to isolate coverage data
component_management:
  # No default_rules.statuses and no per-component statuses: components only feed the
  # "components" table in the PR comment. Statuses here would each post a
  # codecov/project/<id> and codecov/patch/<id> check on every PR (about 17 in all).
  individual_components:
    # Core automation modules - web scraping and data collection
    # Currently at 20.82% - complex Selenium-based code requiring extensive mocking
    - component_id: core_automation
      name: Core Automation
      paths:
        - "src/cqc_cpcc/brightspace.py"
        - "src/cqc_cpcc/my_colleges.py"
        - "src/cqc_cpcc/attendance.py"
        - "src/cqc_cpcc/find_student.py"
    
    # AI/LLM functionality - OpenAI, OpenRouter, prompts
    # Currently at 75.13% - close to target
    - component_id: ai_llm
      name: AI/LLM
      paths:
        - "src/cqc_cpcc/utilities/AI/**"
    
    # Rubric grading system - models, config, scoring
    # Currently at 84.30% - exceeds target
    - component_id: rubric_grading
      name: Rubric Grading
      paths:
        - "src/cqc_cpcc/rubric_*.py"
        - "src/cqc_cpcc/scoring/**"
    
    # Exam and project grading
    # Currently at 74.76% - good baseline
    - component_id: exam_grading
      name: Exam & Project Grading
      paths:
        - "src/cqc_cpcc/exam_review.py"
        - "src/cqc_cpcc/project_feedback.py"
        - "src/cqc_cpcc/error_*.py"
    
    # Feedback and document generation
    # Currently at 98.98% - excellent coverage!
    - component_id: feedback_generation
      name: Feedback Generation
      paths:
        - "src/cqc_cpcc/feedback_doc_generator.py"
        - "src/cqc_cpcc/student_feedback_builder.py"
    
    # Utilities - general, unit-testable helper functions only.
    # NOTE: utils.py (Selenium MFA/login bridge) and selenium_util.py (WebDriver
    # helpers) moved to the informational "Browser Automation & MFA" component — they
    # are browser-driven and tested via integration/e2e, not unit tests.
    - component_id: utilities
      name: Utilities
      paths:
        - "src/cqc_cpcc/utilities/date.py"
        - "src/cqc_cpcc/utilities/logger.py"
        - "src/cqc_cpcc/utilities/pdf_utils.py"
        - "src/cqc_cpcc/utilities/zip_grading_utils.py"
    
    # Streamlit UI - user interface components
    # Tested by unit tests (AppTest) and E2E. The 25% baseline predates unit
    # coverage being counted for this directory.
    - component_id: streamlit_ui
      name: Streamlit UI
      paths:
        - "src/cqc_streamlit_app/**"

    # Browser Automation & MFA - Selenium/WebDriver-driven modules.
    # These collect submissions/instructions from BrightSpace, drive the MFA/login
    # flow, and write grades back — all against a LIVE browser. They are exercised by
    # the integration/e2e suites (and verified manually against the live site), not by
    # unit tests, so their coverage is tracked INFORMATIONALLY (reported, never blocks)
    # — same philosophy as "Core Automation". This keeps the patch gate honest for
    # pure logic while still surfacing these modules' coverage trend.
    - component_id: browser_automation
      name: Browser Automation & MFA
      paths:
        - "src/cqc_cpcc/utilities/selenium_util.py"
        - "src/cqc_cpcc/utilities/utils.py"
        - "src/cqc_cpcc/utilities/brightspace_fetch.py"
        - "src/cqc_cpcc/utilities/brightspace_submissions.py"
        - "src/cqc_cpcc/utilities/brightspace_writeback.py"

# ---------------------------------------------------------------------------
# History: component patch statuses were removed
# ---------------------------------------------------------------------------
#
# Component patch statuses used to post per-component checks. Codecov's
# diff-to-coverage line mapping counts docstring, blank and continuation lines in
# edited files as misses (PR #280, #267, #281), so those gates measured formatting,
# not tests. All per-component statuses are gone; the components remain as a table in
# the PR comment. The repository-wide `codecov/patch` gate at 80% still enforces.
